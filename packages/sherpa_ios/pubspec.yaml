name: sherpa_ios
description: iOS side of Sherpa's native channels (survival/ai fallback and the offline 3D map).
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.40.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: SherpaIosPlugin
