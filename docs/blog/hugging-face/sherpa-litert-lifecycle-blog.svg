<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="860" viewBox="0 0 1720 860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6670"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1A73E8"/>
    </marker>
  </defs>

  <rect width="1720" height="860" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="60" y="62" font-size="34" font-weight="700" fill="#1F2A30">How the models load and unload on Android</text>
  <text x="60" y="98" font-size="20" fill="#5B6670">The voice models stay ready. Gemma loads only when a question needs it and is released when idle.</text>

  <!-- Timeline -->
  <line x1="370" y1="190" x2="1660" y2="190" stroke="#C9D3D9" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g font-size="17" font-weight="700" fill="#1F2A30" text-anchor="middle">
    <text x="490" y="166">App starts</text>
    <text x="750" y="166">First question</text>
    <text x="1010" y="166">Answer streams</text>
    <text x="1270" y="166">Follow-up</text>
    <text x="1530" y="166">5 minutes idle</text>
  </g>
  <g fill="#FFFFFF" stroke="#5B6670" stroke-width="2.5">
    <circle cx="490" cy="190" r="8"/>
    <circle cx="750" cy="190" r="8"/>
    <circle cx="1010" cy="190" r="8"/>
    <circle cx="1270" cy="190" r="8"/>
    <circle cx="1530" cy="190" r="8"/>
  </g>
  <!-- Column guides -->
  <g stroke="#E3E8EB" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="620" y1="215" x2="620" y2="700"/>
    <line x1="880" y1="215" x2="880" y2="700"/>
    <line x1="1140" y1="215" x2="1140" y2="700"/>
    <line x1="1400" y1="215" x2="1400" y2="700"/>
  </g>

  <!-- Lane 1: voice models (LiteRT) -->
  <text x="60" y="268" font-size="14" font-weight="700" letter-spacing="2" fill="#4E7A5E">LITERT</text>
  <text x="60" y="298" font-size="22" font-weight="700" fill="#1F2A30">Voice models</text>
  <text x="60" y="326" font-size="16" fill="#3D4850">Zipformer · GPU</text>
  <text x="60" y="350" font-size="16" fill="#3D4850">Laya · GPU</text>
  <text x="60" y="374" font-size="16" fill="#3D4850">KittenTTS · CPU</text>

  <rect x="375" y="250" width="1275" height="130" rx="16" fill="#E6F2EA" stroke="#4E7A5E" stroke-width="2.5"/>
  <text x="1012" y="306" font-size="21" font-weight="700" fill="#1F2A30" text-anchor="middle">Loaded at startup, ready for every question</text>
  <text x="1012" y="338" font-size="16" fill="#3D4850" text-anchor="middle">Laya reuses its CompiledModel input and output buffers across calls</text>

  <!-- Lane 2: Gemma (LiteRT-LM) -->
  <text x="60" y="448" font-size="14" font-weight="700" letter-spacing="2" fill="#1A73E8">LITERT-LM</text>
  <text x="60" y="478" font-size="22" font-weight="700" fill="#1F2A30">Gemma 4 E2B</text>
  <text x="60" y="506" font-size="16" fill="#3D4850">Tensor bundle · TPU</text>

  <!-- Standby -->
  <rect x="385" y="430" width="210" height="140" rx="16" fill="#F5F7F8" stroke="#C9D3D9" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="490" y="490" font-size="21" font-weight="700" fill="#5B6670" text-anchor="middle">Standby</text>
  <text x="490" y="518" font-size="16" fill="#7A858D" text-anchor="middle">not loaded yet</text>

  <!-- Load -->
  <rect x="645" y="430" width="210" height="140" rx="16" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="750" y="482" font-size="21" font-weight="700" fill="#1F2A30" text-anchor="middle">Load engine</text>
  <text x="750" y="510" font-size="16" fill="#3D4850" text-anchor="middle">on the first question</text>
  <text x="750" y="544" font-size="14" fill="#5B6670" text-anchor="middle">Tensor G5 TPU</text>

  <!-- Stream -->
  <rect x="905" y="430" width="210" height="140" rx="16" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="1010" y="482" font-size="21" font-weight="700" fill="#1F2A30" text-anchor="middle">Stream tokens</text>
  <text x="1010" y="510" font-size="16" fill="#3D4850" text-anchor="middle">KittenTTS speaks each</text>
  <text x="1010" y="532" font-size="16" fill="#3D4850" text-anchor="middle">finished sentence</text>

  <!-- Reuse -->
  <rect x="1165" y="430" width="210" height="140" rx="16" fill="#E8F0FE" stroke="#1A73E8" stroke-width="2.5"/>
  <text x="1270" y="482" font-size="21" font-weight="700" fill="#1F2A30" text-anchor="middle">Reuse engine</text>
  <text x="1270" y="510" font-size="16" fill="#3D4850" text-anchor="middle">no reload for</text>
  <text x="1270" y="532" font-size="16" fill="#3D4850" text-anchor="middle">follow-up questions</text>

  <!-- Release -->
  <rect x="1425" y="430" width="210" height="140" rx="16" fill="#F5F7F8" stroke="#C9D3D9" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="1530" y="482" font-size="21" font-weight="700" fill="#5B6670" text-anchor="middle">Release engine</text>
  <text x="1530" y="510" font-size="16" fill="#7A858D" text-anchor="middle">frees memory</text>
  <text x="1530" y="532" font-size="16" fill="#7A858D" text-anchor="middle">until the next question</text>

  <g stroke="#5B6670" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <line x1="595" y1="500" x2="641" y2="500"/>
    <line x1="855" y1="500" x2="901" y2="500"/>
    <line x1="1115" y1="500" x2="1161" y2="500"/>
    <line x1="1375" y1="500" x2="1421" y2="500"/>
  </g>

  <!-- GPU fallback -->
  <rect x="580" y="625" width="340" height="56" rx="28" fill="#FFFFFF" stroke="#1A73E8" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="750" y="649" font-size="15" fill="#1A73E8" text-anchor="middle">If the Tensor bundle fails to start,</text>
  <text x="750" y="670" font-size="15" fill="#1A73E8" text-anchor="middle">retry on GPU with the standard bundle</text>
  <line x1="750" y1="625" x2="750" y2="576" stroke="#1A73E8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Bridge -->
  <rect x="60" y="730" width="1600" height="64" rx="16" fill="#1F2A30"/>
  <text x="90" y="769" font-size="17" font-weight="700" fill="#FFFFFF">Flutter ⇄ Kotlin</text>
  <text x="260" y="769" font-size="16" fill="#C9D3D9">Requests go over a MethodChannel · transcripts and tokens stream back over an EventChannel · LiteRT 2.3.0</text>

  <!-- Footer -->
  <text x="60" y="834" font-size="14" fill="#7A858D">Models from litert-community on Hugging Face</text>
</svg>
