[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geopdf-locator"
version = "0.1.0"
description = "Offline place-name lookup on georeferenced PDF maps (GeoPDF)"
requires-python = ">=3.10"
dependencies = ["pymupdf>=1.24", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
geopdf-locate = "geopdf_locator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
